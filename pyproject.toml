[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "latte"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "matplotlib", "pyvista", "pyvistaqt", "PySide6"]

[project.scripts]
latte = "latte.gui.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
latte = ["analysis/roskam/data/*.csv"]